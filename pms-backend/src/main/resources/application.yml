server:
  port: ${PORT:8081}
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024


spring:
  application:
    name: pms-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/pmsdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:pms_user}
    password: ${DB_PASSWORD:}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  pharmacy:
    name: "Olanta Pharmacy"
    license: "PH-ET-2026-88910"
    tax-number: "TIN-0098712345"
    address: "Bole Medhanialem, Suite 402, Addis Ababa, Ethiopia"
    phone: "+251-911-000000"
    email: "contact@olantapharmacy.com"
  seed:
    admin-password: ${ADMIN_INITIAL_PASSWORD:}
    pharmacist-password: ${PHARMACIST_INITIAL_PASSWORD:}
    cashier-password: ${CASHIER_INITIAL_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
